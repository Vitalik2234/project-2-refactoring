[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -v"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py", "app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
